services:
  web:
    image: nginx:alpine
    container_name: stack-web
    ports:
      - "8085:80"
    volumes:
      - ./html:/usr/share/nginx/html:ro

  cache-redis:
    image: redis:alpine
    container_name: stack-redis

  sonde-python:
    build: ./monitor
    container_name: stack-monitor
    depends_on:
      - web
    volumes:
      - ./logs:/app/logs
